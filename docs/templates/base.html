<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        {{ config.title }}
        {% endblock title %}
    </title>

    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>

<body>

<header class="site-header">
    <div class="site-header__inner">

        <a class="site-logo" href="{{ get_url(path='@/_index.md') }}">
            MOSAIC
        </a>

        <nav class="site-nav">
            <a href="{{ get_url(path='@/_index.md') }}">
                Docs
            </a>

            <a href="#">
                Showcase
            </a>

            <a href="#">
                News
            </a>

            <a href="#">
                GitHub
            </a>
        </nav>

    </div>
</header>

<div class="site-layout">

    <aside class="sidebar">
        {% block sidebar %}
        {% endblock sidebar %}
    </aside>

    <main class="content">
        {% block content %}{% endblock content %}
    </main>

</div>

<footer class="site-footer">
    <p>
        MOSAIC Documentation
    </p>
</footer>

</body>
</html>
